spring:
  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always
      #data-locations: data.sql
      #schema-locations: schema.sql

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    generate-ddl: false

    show-sql: true

  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8084

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic
  hystrix:
    enabled: true

logging:
  level:
    ROOT: ERROR
    ru.otus.hw.controller: DEBUG