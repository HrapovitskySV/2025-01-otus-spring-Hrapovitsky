<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="keywords" th:content="${keywords}"/>
    <title>List of all authors</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        .persons {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .persons tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .persons td:last-child, td:first-child {
            width: 50px;
        }

        h3 {
            background-image: url("../static/listmark.png");
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }

    </style>

    <style type="text/css" th:inline="text">
        [[h3]] {
            background-image: url([[@{/listmark.png}]]);
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }
    </style>

    <script>


        function fillTable(authors) {
            let strTBody = ``
            let tbody = document.getElementById(`tbody`)

            authors.forEach(author=>{
                strTBody += `
                    <tr>
                        <td>${author.id}</td>
                        <td>${author.fullName}</td>
                        <td>
                            <a href="/authors/edit/${author.id}">Edit</a>
                        </td>
                    </tr>
                `})
            tbody.innerHTML=strTBody
        }

        function getAllAuthors() {
            fetch("/api/authors", {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
             })
            .then(response => response.json())
            .then(json => {fillTable(json)})
        }

    </script>
</head>
<body  onload="getAllAuthors()">

<h3>Authors:</h3>

<a href = "add.html" th:href = "@{/authors/add}">Add new</a>
<table class="authors">
    <thead>
    <tr>
        <th>ID</th>
        <th>fullName</th>
        <th>edit</th>
    </tr>
    </thead>
    <tbody  id="tbody"/>
</table>

<p>
    <a href="bookList.html" th:href="@{/}">Книги</a>
</body>
</html>
