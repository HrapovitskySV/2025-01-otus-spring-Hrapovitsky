spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:maindb2
    driverClassName: org.h2.Driver
  sql:
    init:
      mode: always
      #data-locations: data.sql
      #schema-locations: schema.sql
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    generate-ddl: false

    show-sql: true
  main:
    allow-circular-references: true

server:
  port: 8080

logging:
  level:
    ROOT: ERROR
    ru.otus.hw.controller: DEBUG